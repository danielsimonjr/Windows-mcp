name: Claude Guard

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  guard:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Checked out from the default branch (this workflow's own copy, per the
      # workflow_run trigger semantics) — a PR cannot edit its own gate.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve PR + author
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source .github/claude-guard.env
          pr=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            # No PR maps to this head SHA — not a PR context, nothing to gate.
            echo "act=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author=$(jq -r '.user.login' <<<"$pr")
          number=$(jq -r '.number' <<<"$pr")
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ "$author" != "$CLAUDE_BOT_LOGIN" ]; then
            # claude-guard is a REQUIRED check on this repo, so every PR must get a
            # check-run — otherwise non-claude-bot PRs would hang forever waiting on it.
            echo "act=notapplicable" >> "$GITHUB_OUTPUT"
          else
            echo "act=run" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate guard
        if: steps.pr.outputs.act == 'run'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Include previous_filename too: on a rename the Files API returns
          # only the DESTINATION filename, so a rename-only diff would dodge
          # the src/ capability guard unless the source path is also checked.
          gh api "repos/${{ github.repository }}/pulls/$NUMBER/files" --paginate \
            --jq '.[].filename, (.[]|select(.previous_filename)|.previous_filename)' > changed.txt
          added=$(gh api "repos/${{ github.repository }}/pulls/$NUMBER" --jq '.additions')
          if bash .github/scripts/claude-guard.sh changed.txt "$added" > verdict.txt 2>verdict.stderr.log; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          # Script stderr (noise/errors) stays in the runner log only — it must
          # never become part of the public summary or the injection surface.
          cat verdict.stderr.log >&2 || true
          # Sanitize verdict text (derived from untrusted PR diff content): strip
          # control characters and cap length before it becomes an output.
          tr -cd '[:print:]\n' < verdict.txt | head -c 4000 > verdict.sanitized.txt
          # Use a random per-run delimiter for both the stop-commands zone and the
          # $GITHUB_OUTPUT heredoc, so a verdict line cannot forge a static
          # delimiter (e.g. "::guardblock::" or "EOF") to inject workflow/output
          # commands.
          DELIM="guardblock_$(openssl rand -hex 16)"
          { echo "::stop-commands::$DELIM"; cat verdict.sanitized.txt; echo "::$DELIM::"; } || true
          echo "summary<<$DELIM" >> "$GITHUB_OUTPUT"
          cat verdict.sanitized.txt >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Publish check-run (not applicable)
        if: steps.pr.outputs.act == 'notapplicable'
        id: post_na
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            -f name='claude-guard' \
            -f head_sha="$SHA" \
            -f status='completed' \
            -f conclusion='success' \
            -f 'output[title]=claude-guard: not applicable' \
            -f 'output[summary]=not a claude-bot PR — guard not applicable'
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Publish check-run (evaluated)
        if: steps.pr.outputs.act == 'run'
        id: post_eval
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.guard.outputs.summary }}
          SHA: ${{ steps.pr.outputs.sha }}
          CONCLUSION: ${{ steps.guard.outputs.conclusion }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            -f name='claude-guard' \
            -f head_sha="$SHA" \
            -f status='completed' \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=claude-guard: $CONCLUSION" \
            -f "output[summary]=$SUMMARY"
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Fail closed if no check-run was posted
        if: always() && steps.pr.outputs.act != 'skip' && steps.post_eval.outputs.posted != 'true' && steps.post_na.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Source the SHA from the event payload (always present) rather than a
          # derived step output, so fail-closed still posts even if "Resolve PR"
          # itself errored before emitting steps.pr.outputs.sha.
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='claude-guard' -f head_sha="$SHA" -f status='completed' \
            -f conclusion='failure' \
            -f 'output[title]=claude-guard: workflow error' \
            -f 'output[summary]=The claude-guard workflow errored before evaluating this PR. Failing closed — a maintainer must review.'

      - name: Comment on block
        if: steps.pr.outputs.act == 'run' && steps.guard.outputs.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SUMMARY: ${{ steps.guard.outputs.summary }}
        run: |
          set -euo pipefail
          body=$'🚫 **claude-guard blocked this PR.**\n\n```\n'"$SUMMARY"$'\n```\n\nA maintainer must review; the bot may not merge changes outside its allowlist or into high-risk sources.'
          gh pr comment "$NUMBER" --repo "${{ github.repository }}" --body "$body"
